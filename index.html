<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <div class="search">
            <input type="text" placeholder="Enter location name" spellcheck="false">
            <button><img src="images/magnifying-glass-solid-full.svg" alt="Search icon"></button>
        </div>
        <div class="Weather">
            <img src="images/weather.png" alt="weather-icon" class="weather-icon">
            <h1 class="Temp">10°C</h1>
            <h2 class="location">Location</h2>
            <div class="details">
                <div class="col">
                    <img src="images/humidity.png" alt="humidity" class="humidity-img">
                    <div>
                        <p class="humidity-txt">50%</p>
                        <p>Humidity</p>
                    </div>
                </div>
                <div class="col">
                    <img src="images/wind-speed.png" alt="wind-speed" class="wind-speed">
                    <div>
                        <p class="windspeed-txt">12 km/h</p>
                        <p>Wind Speed</p>
                    </div>
                </div>
            </div>
            
        </div>
    </div>

    <script src="app.js"></script>

</body>
</html>
